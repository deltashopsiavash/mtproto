services:
  backend:
    build: ./backend
    container_name: mtproto_panel_backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [panel]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mtproto_panel_frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${PANEL_PORT:-8080}:80"
    networks: [panel]
networks:
  panel:
    name: mtproto-panel_default
