<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delta MTProto Panel</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="layout">
<aside><h2>Delta</h2><button onclick="tab('overview')">Overview</button><button onclick="tab('users')">Users</button><button onclick="tab('settings')">Settings</button><a href="/logout">خروج</a></aside>
<main>
<section id="overview" class="page"><h1>Overview</h1><div id="cards" class="cards"></div></section>
<section id="users" class="page hidden"><div class="head"><h1>Users</h1><button onclick="openUser()">ساخت یوزر</button></div><div id="usersList" class="users"></div></section>
<section id="settings" class="page hidden"><h1>Settings</h1><div class="panel">
<input id="public_host" placeholder="Domain or IP">
<input id="proxy_port" placeholder="Proxy Port">
<input id="sub_port" placeholder="Sub Port">
<input id="panel_user" placeholder="Panel Username">
<input id="panel_pass" placeholder="New Password">
<input id="bot_token" placeholder="Bot Token">
<input id="bot_admin_id" placeholder="Bot Admin ID">
<button onclick="saveSettings()">ذخیره تنظیمات</button>
<a class="btn" href="/api/backup/download">دانلود بکاپ</a>
<input type="file" id="restoreFile"><button onclick="restoreBackup()">ایمپورت بکاپ</button>
</div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle">ساخت یوزر</h2>
<input id="u_name" placeholder="اسم کاربر"><input id="u_days" type="number" placeholder="روز اعتبار" value="30">
<select id="u_unit"><option>GB</option><option>MB</option></select><input id="u_volume" type="number" placeholder="حجم">
<button onclick="saveUser()">ذخیره</button><button onclick="closeUser()">بستن</button></div></div>
<script src="/static/app.js"></script></body></html>
