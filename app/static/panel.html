<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DELTA MTProto Panel</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">DELTA</div>
    <button class="nav active" data-page="overview">Overview</button>
    <button class="nav" data-page="users">Users</button>
    <button class="nav" data-page="logs">Logs</button>
    <form method="post" action="/api/logout"><button class="logout">خروج</button></form>
  </aside>

  <main class="main">
    <section id="overview" class="page active">
      <div class="topbar">
        <div>
          <h1>Overview</h1>
          <p>مشخصات کامل سرور و وضعیت سرویس MTProto</p>
        </div>
        <button onclick="restartProxy()">Restart Proxy</button>
      </div>
      <div id="cards" class="cards"></div>
    </section>

    <section id="users" class="page">
      <div class="topbar">
        <div>
          <h1>Users</h1>
          <p>برای هر کاربر یک Secret و لینک اختصاصی ساخته می‌شود.</p>
        </div>
      </div>
      <div class="grid2">
        <form id="userForm" class="box">
          <h2>ساخت کاربر جدید</h2>
          <label>نام کاربر</label>
          <input name="name" placeholder="مثلاً Ali" required />
          <label>تاریخ انقضا</label>
          <input name="expire_at" type="datetime-local" />
          <label>حجم / سهمیه GB</label>
          <input name="quota_gb" type="number" min="0" step="0.1" value="0" />
          <label>یادداشت</label>
          <textarea name="note" rows="3" placeholder="اختیاری"></textarea>
          <button type="submit">ساخت پروکسی اختصاصی</button>
          <p class="hint">فعلاً حجم ذخیره می‌شود؛ اعمال دقیق محدودیت حجم در نسخه بعدی اضافه می‌شود.</p>
        </form>
        <div class="box">
          <h2>لیست کاربران</h2>
          <div id="userList" class="user-list"></div>
        </div>
      </div>
    </section>

    <section id="logs" class="page">
      <div class="topbar">
        <div>
          <h1>Logs</h1>
          <p>آخرین لاگ‌های سرویس پروکسی</p>
        </div>
        <button onclick="loadLogs()">Refresh</button>
      </div>
      <pre id="logBox" class="logs"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
